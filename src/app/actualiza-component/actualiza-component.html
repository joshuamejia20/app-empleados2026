<p>actualiza-component works!</p>
<form class="form-group row">
    <div class="form-group col-md-3">
      <label for="nombre">Nombre</label>
      <input type="text" class="form-control" id="nombre" placeholder="Nombre" [(ngModel)]="cuadroNombre" name="nombre">
    </div>
    <div class="form-group col-md-3">
      <label for="apellido">Apellido</label>
      <input type="text" class="form-control" id="apellido" placeholder="Apellido" [(ngModel)]="cuadroApellido" name="apellido">
    </div>
    <div class="form-group col-md-3">
      <label for="cargo">Cargo</label>
      <input type="text" class="form-control" id="cargo" placeholder="Cargo" [(ngModel)]="cuadroCargo" name="cargo">
    </div>
    <div class="form-group col-md-3">
      <label for="salario">Salario</label>
      <input type="number" class="form-control" id="salario" placeholder="Salario" [(ngModel)]="cuadroSalario" name="salario">
    </div>
    <div class="form-group col-md-12">
      <button type="button" class="btn btn-outline-warning" (click)="actualizar_empleado()">Actualizar Empleado</button>
    </div>
  </form>
<div style="text-align: center;">
  <button class="btn btn-primary" (click)="volverHome()">Ir a Home</button>
</div>
