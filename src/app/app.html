<div class="container">
  <div class="col">
    <h1 class="text-center">{{titulo}}</h1>
  </div>
  <br>
  <form class="form-group row">
    <div class="form-group col-md-3">
      <label for="nombre">Nombre</label>
      <input type="text" class="form-control" id="nombre" placeholder="Nombre" [(ngModel)]="cuadroNombre" name="nombre">
    </div>
    <div class="form-group col-md-3">
      <label for="apellido">Apellido</label>
      <input type="text" class="form-control" id="apellido" placeholder="Apellido" [(ngModel)]="cuadroApellido" name="apellido">
    </div>
    <div class="form-group col-md-3">
      <label for="cargo">Cargo</label>
      <input type="text" class="form-control" id="cargo" placeholder="Cargo" [(ngModel)]="cuadroCargo" name="cargo">
    </div>
    <div class="form-group col-md-3">
      <label for="salario">Salario</label>
      <input type="number" class="form-control" id="salario" placeholder="Salario" [(ngModel)]="cuadroSalario" name="salario">
    </div>
    <div class="form-group col-md-12">
      <button type="button" class="btn btn-outline-success" (click)="agregar_empleado()">Agregar Empleado</button>
    </div>
  </form>
</div>
@for (empleado of empleados; track $index; let i = $index){
  <app-empleado-hijo-c [empleadoLista]="empleado" [indice]="i"></app-empleado-hijo-c>
}
